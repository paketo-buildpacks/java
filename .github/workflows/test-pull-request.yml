name: Test Pull Request

on:
  pull_request:
    branches:
    - main

concurrency:
  # only one instance of test suite per PR at one time
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  builders:
    name: Get Builders for Testing
    runs-on: ubuntu-24.04
    outputs:
      builders: ${{ steps.builders.outputs.builders }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Get builders from integration.json
      id: builders
      run: |
        source "${GITHUB_WORKSPACE}/scripts/.util/builders.sh"

        builders="$(util::builders::list "${GITHUB_WORKSPACE}/integration.json")"
        printf "Output: %s\n" "${builders}"
        printf "builders=%s\n" "${builders}" >> "$GITHUB_OUTPUT"

  integration:
    name: Integration Tests with Builders
    runs-on: ubuntu-24.04
    needs: [builders]
    strategy:
      matrix:
        builder: ${{ fromJSON(needs.builders.outputs.builders) }}
      fail-fast: false  # don't cancel all test jobs when one fails
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    # Causes errors with integration tests
    - name: Disable containerd snapshotter
      run: |
        echo '{"features": {"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker

    - name: Run Integration Tests
      env:
        TMPDIR: "${{ runner.temp }}"
        GIT_TOKEN: ${{ github.token }}
        BUILDER: ${{ matrix.builder }}
      run: ./scripts/integration.sh --builder "${BUILDER}"

  roundup:
    name: Integration Tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    needs: integration
    steps:
    - env:
        RESULT: ${{ needs.integration.result }}
      run: |
        result="${RESULT}"
        if [[ $result == "success" ]]; then
          echo "Integration tests passed against all builders"
          exit 0
        else
          echo "Integration tests failed on one or more builders"
          exit 1
        fi

  upload:
    name: Upload Workflow Event Payload
    runs-on: ubuntu-24.04
    permissions:
      actions: write # upload the workflow event payload artifact
    steps:
    - name: Upload Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: event-payload
        path: ${{ github.event_path }}

permissions:
  contents: read
